apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clima-ingress
  namespace: clima-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sensor-service,api-gateway"
spec:
  tls:
    - hosts:
        - sistema-climatico.example
        - villacanales-clima.duckdns.org
      secretName: clima-tls-cert
  rules:
    - host: sistema-climatico.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
