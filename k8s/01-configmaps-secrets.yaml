apiVersion: v1
kind: ConfigMap
metadata:
  name: clima-global-config
  namespace: clima-system
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  NODE_ENV: "production"
  PYTHONUNBUFFERED: "1"
  COMMUNITY_SERVICE_URL: "http://community-service:5001"
  SENSOR_SERVICE_URL: "http://sensor-service:5002"
  ALERT_SERVICE_URL: "http://alert-service:8081"
  REPORT_SERVICE_URL: "http://report-service:8000"
  AUDIT_SERVICE_URL: "http://audit-service:8001"
  POSTGRES_HOST: "postgres-db"
  POSTGRES_PORT: "5432"
  SQLSERVER_HOST: "sqlserver-db"
  SQLSERVER_PORT: "1433"
  MONGO_HOST: "mongo-db"
  MONGO_PORT: "27017"
  # Parámetros OIDC / OAuth 2.0 (Fase 4)
  JWT_ISSUER: "climate-auth"
  JWT_AUDIENCE: "climate-api"
  OAUTH_REDIRECT_BASE: "https://sistema-climatico.example"
---
apiVersion: v1
kind: Secret
metadata:
  name: clima-secrets
  namespace: clima-system
type: Opaque
stringData:
  JWT_SECRET: "ClimaSafe_Secret_Key_Super_Secure_2026_UMG_VillaCanales!"
  POSTGRES_PASSWORD: "ClimaSafePostgres2026!"
  SQLSERVER_SA_PASSWORD: "ClimaDB_Secure2026!"
  MONGO_INITDB_ROOT_PASSWORD: "ClimaSafeMongo2026!"
  # Secretos OAuth 2.0 / OpenID Connect (RNF-OAUTH-01 & RNF-OAUTH-02)
  GOOGLE_CLIENT_ID: "clima-google-client-id-fase4.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "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26"
  GITHUB_CLIENT_ID: "clima-github-client-id-fase4"
  GITHUB_CLIENT_SECRET: "ghp_ClimaSafeGitHubOAuthSecret2026SecureKey"
