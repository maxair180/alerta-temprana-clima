# 1. API GATEWAY (ASP.NET CORE 10 & YARP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: clima-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: climasafe/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: clima-global-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: clima-system
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

# 2. AUTH SERVICE (NODE.JS / NESTJS / POSTGRESQL)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: clima-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth
          image: climasafe/auth-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres-db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clima-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: clima-system
spec:
  selector:
    app: auth-service
  ports:
    - port: 3000
      targetPort: 3000

