server.port=8081

spring.application.name=alert-service

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:alert_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:ClimaSafePostgres2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# En caso de fallo de conexión en desarrollo inicial
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
