version: '3.8'

services:
  # ===========================================================================
  # 1. BASE DE DATOS: SQL Server 2022+ en Linux Container
  # ===========================================================================
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clima_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ClimaDB_Secure2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - clima_network

  # ===========================================================================
  # 2. INICIALIZADOR AUTOMÁTICO DE BASE DE DATOS (SEED & SCHEMA)
  # ===========================================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clima_db_init
    depends_on:
      - database
    volumes:
      - ../database/schema.sql:/usr/src/app/schema.sql
      - ./db-init.sh:/usr/src/app/db-init.sh
    entrypoint: ["/bin/bash", "/usr/src/app/db-init.sh"]
    networks:
      - clima_network

  # ===========================================================================
  # 3. BACKEND: C# .NET Web API + SignalR + BackgroundService
  # ===========================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: clima_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=ClimaDB;User Id=sa;Password=ClimaDB_Secure2026!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - clima_network

  # ===========================================================================
  # 4. FRONTEND: Angular SPA Dashboard en Nginx
  # ===========================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: clima_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clima_network

volumes:
  sql_data:
    driver: local

networks:
  clima_network:
    driver: bridge
